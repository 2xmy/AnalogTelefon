esphome:
  name: analog_telefon
  friendly_name: Analog Telefon
  includes:
    - components/AnalogTelefon/AnalogTelefon.h

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:
  level: INFO
  logs:
    analog_telefon: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key
  services:
    - service: key_pressed
      variables:
        key: int
      then:
        - lambda: 'id(analog_telefon_component).on_key_pressed(key);'

ota:
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "AnalogTelefon Fallback"
    password: !secret fallback_password

captive_portal:

# Custom component for the analog telephone
external_components:
  - source: components
    components: [ analog_telefon ]

# Register the component
analog_telefon:
  id: analog_telefon_component

# Text sensors to show the last pressed key (optional)
text_sensor:
  - platform: template
    name: "Last Key Pressed"
    id: last_key_pressed
    icon: "mdi:dialpad"

# Add a button to test each key (optional)
button:
  - platform: template
    name: "Test Key 1"
    on_press:
      - lambda: 'id(analog_telefon_component).on_key_pressed(1);'
  
  - platform: template
    name: "Test Key 2"
    on_press:
      - lambda: 'id(analog_telefon_component).on_key_pressed(2);'
  
  - platform: template
    name: "Test Key 3"
    on_press:
      - lambda: 'id(analog_telefon_component).on_key_pressed(3);'
  
  - platform: template
    name: "Test Key 4"
    on_press:
      - lambda: 'id(analog_telefon_component).on_key_pressed(4);'
  
  - platform: template
    name: "Test Key 5"
    on_press:
      - lambda: 'id(analog_telefon_component).on_key_pressed(5);'
  
  - platform: template
    name: "Test Key 6"
    on_press:
      - lambda: 'id(analog_telefon_component).on_key_pressed(6);'
  
  - platform: template
    name: "Test Key 7"
    on_press:
      - lambda: 'id(analog_telefon_component).on_key_pressed(7);'
  
  - platform: template
    name: "Test Key 8"
    on_press:
      - lambda: 'id(analog_telefon_component).on_key_pressed(8);'
  
  - platform: template
    name: "Test Key 9"
    on_press:
      - lambda: 'id(analog_telefon_component).on_key_pressed(9);'

